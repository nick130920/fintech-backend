        - sms
        - push
        - email
        example: sms
        type: string
      message:
        example: Compra por $50.000 en SUPERMERCADO XYZ el 15/01/2024
        type: string
      metadata:
        additionalProperties: true
        type: object
      phone:
        example: "+573001234567"
