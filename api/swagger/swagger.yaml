  version: "1.0"
paths:
  /account-deletion:
    get:
      description: Devuelve la página informativa para eliminación de cuenta en formato
        HTML
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Eliminación de cuenta
      tags:
      - legal
  /api/v1/accounts:
    get:
      description: Obtiene las cuentas del usuario autenticado. Si envías page/per_page
        retorna respuesta paginada.
      parameters:
      - description: Página (opcional para paginación)
        in: query
        name: page
        type: integer
      - description: Elementos por página (opcional para paginación)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
        "401":
          description: Unauthorized
