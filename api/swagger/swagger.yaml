        maximum: 1
        minimum: 0
        type: number
      description:
        maxLength: 500
        type: string
      example_message:
        maxLength: 2000
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      name:
        maxLength: 100
        minLength: 1
        type: string
      priority:
        minimum: 1
        type: integer
      requires_validation:
        type: boolean
      tags:
        items:
          type: string
        type: array
