      branch_name:
        maxLength: 100
        type: string
      color:
        type: string
      currency:
        type: string
      icon:
        maxLength: 50
        type: string
      is_notification_enabled:
        type: boolean
      min_amount_to_notify:
        minimum: 0
        type: number
      notes:
        maxLength: 1000
        type: string
      notification_email:
        type: string
      notification_phone:
        maxLength: 15
        minLength: 10
        type: string
      type:
