      account_number_mask:
        type: string
      bank_code:
        type: string
      bank_name:
        type: string
      branch_code:
        type: string
      branch_name:
        type: string
      color:
        type: string
      created_at:
        type: string
      currency:
        type: string
      display_name:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_notification_enabled:
