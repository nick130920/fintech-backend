      spent_amount:
        type: number
      total_amount:
        type: number
      year:
        type: integer
    type: object
  dto.CategoriesResponse:
    properties:
      default_categories:
        items:
          $ref: '#/definitions/dto.CategorySummaryResponse'
        type: array
