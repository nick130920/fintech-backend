  dto.BankNotificationPatternResponse:
    properties:
      auto_approve:
        type: boolean
      bank_account_id:
        type: integer
      channel:
        $ref: '#/definitions/entity.NotificationChannel'
      confidence_threshold:
        type: number
      created_at:
        type: string
      description:
        type: string
      example_message:
        type: string
      id:
        type: integer
      is_default:
